; PlatformIO Project Configuration for AI Monitor P4
; Hardware: GUITION JC4880P433 ESP32-P4 4.3" Touch Display Dev Board
; Purpose : dedicated desk display for AI provider usage limits, speaking the
;           tobymarks/esp32-ai-monitor USB serial protocol (AIM1/JSON).
; Display : MIPI-DSI (ST7701S) + LVGL 9 + GT911 capacitive touch.

[platformio]
default_envs = esp32p4-release
build_dir = .pio/build-fw

[esp32_common]
; Pin to a specific pioarduino release to prevent upstream breakage
platform      = https://github.com/pioarduino/platform-espressif32.git#2959e98a2750832bca32fd2f849c0c274a4cdd63
board         = esp32-p4
framework     = arduino

board_build.flash_size  = 16MB
board_upload.flash_size = 16MB
board_build.partitions  = default_16MB.csv
board_build.filesystem  = littlefs
board_build.psram_type  = opi
board_build.psram_size  = 32MB
board_build.arduino.memory_type = qio_qspi
board_build.vdd = 2800

build_flags =
  -D BOARD_HAS_PSRAM
  -D mcu=esp32p4
  -D CONFIG_ESP_LCD_TOUCH_MAX_POINTS=5
  -D ESP_LCD_ST7701_VER_MAJOR=1
  -D ESP_LCD_ST7701_VER_MINOR=0
  -D ESP_LCD_ST7701_VER_PATCH=0
  ; USB-CDC: the AI Monitor companion talks to us over the USB-C port
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DLV_CONF_INCLUDE_SIMPLE=1
    -DLV_USE_LZ4_INTERNAL=1
  -I lib
  -I lib/esp_lcd_st7701/priv_include
  -DARDUINO_LOOP_STACK_SIZE=32768
  -DESP_PANEL_DRIVERS_BUS_ENABLE_RGB=1
  -DCONFIG_RMT_ISR_IRAM_SAFE=1
  -DCONFIG_GPTIMER_ISR_IRAM_SAFE=1
  -Wno-deprecated-declarations
  -Wno-unused-parameter
  -Wno-unused-variable
  -Wno-unused-function
  -Wno-sign-compare
  -Wno-missing-field-initializers
  -Wno-unknown-pragmas

lib_deps =
  https://github.com/lvgl/lvgl.git#80ca777e37a2b176770726a02e07a6fb79ef0b39
  bblanchon/ArduinoJson@7.4.3

upload_speed  = 115200
monitor_speed = 115200

; Explicit diagnostic builds only. Production/release builds do not collect graphics timings.
[env:esp32p4-graphics]
extends = env:esp32p4-release
build_flags = ${env:esp32p4-release.build_flags} -DAIM_GRAPHICS_TELEMETRY=1

; Private crypto measurement; no enrollment key or real permission sender is enabled.
[env:esp32p4-auth-benchmark]
extends = env:esp32p4-release
build_flags = ${env:esp32p4-release.build_flags} -DAIM_USB_AUTH_BENCHMARK=1

; Developer integration only. Opt-in starts false and cannot be set by USB messages.
; Do not publish/flash as production until physical enrollment/UI/provider tests pass.
[env:esp32p4-permission-integration]
extends = env:esp32p4-release
build_flags = ${env:esp32p4-release.build_flags} -DAIM_USB_PERMISSION_RUNTIME=1

[env:esp32s3-waveshare-43-graphics]
extends = env:esp32s3-waveshare-43-release
build_flags = ${env:esp32s3-waveshare-43-release.build_flags} -DAIM_GRAPHICS_TELEMETRY=1

[env:esp32p4-ppa-benchmark]
extends = env:esp32p4-graphics
build_flags = ${env:esp32p4-graphics.build_flags} -DAIM_PPA_BENCHMARK=1

; Standalone early C6 test: deliberately excludes all normal UI/host/Claude sources.
; This is not a distributable monitor image and must never be included in a release package.
[env:esp32p4-c6-probe]
extends = env:esp32p4-release
build_flags = ${env:esp32p4-release.build_flags} -DAIM_C6_PROBE=1
build_src_filter = -<*> +<diagnostics/c6_probe_main.cpp>
lib_deps =

; Generated trusted fixtures are developer-only; this does not change runtime packs.
[env:esp32p4-asset-benchmark]
extends = env:esp32p4-release
build_flags = ${env:esp32p4-release.build_flags} -DAIM_ASSET_BENCHMARK=1 -DLV_USE_LZ4_INTERNAL=1 -DLV_USE_RLE=1 -I work/asset-target-fixtures
build_src_filter = -<*> +<diagnostics/asset_benchmark_main.cpp>

; -----------------------------------------------------------------------------
; PRODUCTION ENVIRONMENT (default for flashing)
; -----------------------------------------------------------------------------
[env:esp32p4-release]
extends = esp32_common
build_src_flags = -Wall -Wextra -Wunused-variable -Wunused-function -Wsign-compare -Werror=return-type
extra_scripts = pre:scripts/pio_pre_unique_bin.py
build_flags =
  ${esp32_common.build_flags}
  -D CORE_DEBUG_LEVEL=0
  -D DEBUG_BUILD=0

; -----------------------------------------------------------------------------
; DEVELOPMENT ENVIRONMENT — verbose serial logging (shares the USB CDC port
; with the AI Monitor protocol; use only while debugging without the companion)
; -----------------------------------------------------------------------------
[env:esp32p4-debug]
extends = esp32_common
build_src_flags = ${env:esp32p4-release.build_src_flags}
extra_scripts = pre:scripts/pio_pre_unique_bin.py
build_flags =
  ${esp32_common.build_flags}
  -D CORE_DEBUG_LEVEL=3
  -D DEBUG_BUILD=1

; Original Waveshare ESP32-S3-Touch-LCD-4.3, CH422G version (experimental).
; Matching Arduino 3.2.0 + official Espressif RGB/XIP SDK, isolated from P4.
[env:esp32s3-waveshare-43-release]
platform = https://github.com/pioarduino/platform-espressif32.git#c6f1f4164d16dae8fda13221eb0f2722429175c6
board = esp32-s3-devkitc-1
framework = arduino
platform_packages =
  platformio/framework-arduinoespressif32-libs@https://dl.espressif.com/AE/esp-arduino-libs/esp32-3.2.0-h.zip
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
build_src_flags = -Wall -Wextra -Werror=return-type
extra_scripts =
  pre:scripts/pio_pre_unique_bin.py
  post:scripts/pio_s3_factory.py
build_flags =
  -D AIM_BOARD_WAVESHARE_S3=1
  -D CONFIG_ESP_LCD_TOUCH_MAX_POINTS=5
  -D BOARD_HAS_PSRAM
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=0
  -D LV_CONF_INCLUDE_SIMPLE=1
  -I lib
  -D CORE_DEBUG_LEVEL=0
  -D DEBUG_BUILD=0
  -Wno-unused-parameter
  -Wno-missing-field-initializers
lib_deps =
  https://github.com/lvgl/lvgl.git#80ca777e37a2b176770726a02e07a6fb79ef0b39
  bblanchon/ArduinoJson@7.4.3
lib_ignore = esp_lcd_st7701, esp_lcd_ek79007
upload_speed = 115200
monitor_speed = 115200
