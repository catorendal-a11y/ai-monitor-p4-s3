name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codex-onboarding:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements.txt
      - run: python scripts/test_codex_windows_install.py --disposable-ci

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements.txt -r scripts/requirements-test.txt
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - run: python -m unittest discover -s tests -p 'test_*.py'

  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        environment: [esp32p4-release, esp32s3-waveshare-43-release]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'platformio>=6.1,<7' -r tools/requirements.txt
      - run: python -m platformio run -e ${{ matrix.environment }}
      - if: matrix.environment == 'esp32p4-release'
        run: sudo apt-get update && sudo apt-get install -y ninja-build cmake libegl1 libopengl0
      - if: matrix.environment == 'esp32p4-release'
        run: python scripts/run_tests.py --ui
      - run: python scripts/collect_firmware.py --environment ${{ matrix.environment }} --output work/prebuilt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: firmware-${{ matrix.environment }}
          path: work/prebuilt/*/*.bin
          if-no-files-found: error
          retention-days: 7

  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install pip-audit==2.10.1
      - run: python -m pip_audit -r tools/requirements.txt -r scripts/requirements-release.txt -r scripts/requirements-test.txt
