name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  hardware-probe-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'platformio>=6.1,<7'
      - run: python -m platformio run -e esp32p4-c6-probe

  codex-onboarding:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements.txt
      - run: python scripts/test_codex_windows_install.py --disposable-ci

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements.txt -r scripts/requirements-test.txt
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libssl-dev g++
      - run: python -X faulthandler -m unittest discover -v -s tests -p 'test_*.py'

  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        environment: [esp32p4-release, esp32s3-waveshare-43-release]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'platformio>=6.1,<7' -r tools/requirements.txt
      - run: python -m platformio run -e ${{ matrix.environment }}
      - if: matrix.environment == 'esp32p4-release'
        run: sudo apt-get update && sudo apt-get install -y ninja-build cmake libegl1 libopengl0 libssl-dev
      - if: matrix.environment == 'esp32p4-release'
        run: python scripts/run_tests.py --ui
      - run: python scripts/collect_firmware.py --environment ${{ matrix.environment }} --output work/prebuilt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: firmware-${{ matrix.environment }}
          path: work/prebuilt/*/*.bin
          if-no-files-found: error
          retention-days: 7

  windows-package:
    # Validate the exact installer on a fresh hosted profile without publishing a release.
    if: github.event_name == 'workflow_dispatch'
    needs: firmware
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: firmware-*
          merge-multiple: true
          path: work/prebuilt
      - run: python -m pip install -r tools/requirements.txt -r scripts/requirements-release.txt
      - run: python scripts/build_windows_release.py --firmware-dir work/prebuilt
      - shell: pwsh
        run: ./scripts/install_inno_builder.ps1 -Destination work/inno-builder
      - name: Clean installation, upgrade and uninstall
        shell: pwsh
        run: |
          $package = Get-ChildItem work/windows-release -Directory | Select-Object -First 1
          python scripts/build_windows_installer.py --package $package.FullName --compiler work/inno-builder/compiler/ISCC.exe --output work/windows-release
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed.' }
          $installer = Get-ChildItem work/windows-release -Filter 'AI-Monitor-Setup-*.exe' | Select-Object -First 1
          python scripts/test_windows_install.py --installer $installer.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Fresh-profile installer verification failed.' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-candidate
          path: |
            work/windows-release/*.zip
            work/windows-release/AI-Monitor-Setup-*.exe
          if-no-files-found: error
          retention-days: 7

  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install pip-audit==2.10.1
      - run: python -m pip_audit -r tools/requirements.txt -r scripts/requirements-release.txt -r scripts/requirements-test.txt
