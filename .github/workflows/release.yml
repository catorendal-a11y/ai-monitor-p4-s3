name: Portable Windows release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.release.outputs.build }}
    steps:
      - name: Preserve an existing reviewed release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'build=false' >> "$GITHUB_OUTPUT"
          else
            echo 'build=true' >> "$GITHUB_OUTPUT"
          fi

  firmware:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: esp32p4-release
            board: guition-p4
          - environment: esp32s3-waveshare-43-release
            board: waveshare-s3-43
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Require tag to match firmware version
        run: |
          python - <<'PY'
          import os, pathlib, re
          version = re.search(r'#define FW_VERSION "([^"]+)"', pathlib.Path('src/config.h').read_text()).group(1)
          assert os.environ['GITHUB_REF_NAME'] == version, 'Tag must match FW_VERSION'
          PY
      - run: python -m pip install 'platformio>=6.1,<7' -r tools/requirements.txt
      - run: python -m platformio run -e ${{ matrix.environment }}
      - if: matrix.environment == 'esp32p4-release'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libegl1 libopengl0
      - if: matrix.environment == 'esp32p4-release'
        run: python scripts/run_tests.py --ui
      - name: Collect matching factory/application images
        run: python scripts/collect_firmware.py --environment ${{ matrix.environment }} --output work/prebuilt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: firmware-${{ matrix.board }}
          path: work/prebuilt/${{ matrix.board }}/*.bin
          if-no-files-found: error
          retention-days: 7

  windows:
    needs: firmware
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: firmware-guition-p4
          path: work/prebuilt/guition-p4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: firmware-waveshare-s3-43
          path: work/prebuilt/waveshare-s3-43
      - run: python -m pip install -r tools/requirements.txt -r scripts/requirements-release.txt -r scripts/requirements-test.txt
      - name: Test official Codex install without a pre-existing CLI
        run: python scripts/test_codex_windows_install.py --disposable-ci
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python scripts/build_windows_release.py --firmware-dir work/prebuilt
      - name: Test fresh Codex setup through the compiled console helper
        shell: pwsh
        run: |
          $package = Get-ChildItem work/windows-release -Directory | Select-Object -First 1
          python scripts/test_codex_windows_install.py --disposable-ci --helper (Join-Path $package.FullName 'AI-Monitor-Console.exe')
          if ($LASTEXITCODE -ne 0) { throw 'Compiled Codex onboarding failed.' }
      - name: Install authenticated pinned installer compiler
        shell: pwsh
        run: ./scripts/install_inno_builder.ps1 -Destination work/inno-builder
      - name: Build and test per-user installer
        shell: pwsh
        run: |
          $package = Get-ChildItem work/windows-release -Directory | Select-Object -First 1
          python scripts/build_windows_installer.py --package $package.FullName --compiler work/inno-builder/compiler/ISCC.exe --output work/windows-release
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed.' }
          $installer = Get-ChildItem work/windows-release -Filter 'AI-Monitor-Setup-*' | Select-Object -First 1
          python scripts/test_windows_install.py --installer $installer.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Installer smoke tests failed.' }
      - name: Smoke test portable executables
        shell: pwsh
        run: |
          $package = Get-ChildItem work/windows-release -Directory | Select-Object -First 1
          & (Join-Path $package.FullName 'AI-Monitor-Console.exe') --check
          if ($LASTEXITCODE -ne 0) { throw 'Portable host failed.' }
          $gui = Start-Process -FilePath (Join-Path $package.FullName 'AI-Monitor.exe') -ArgumentList '--gui-check' -WindowStyle Hidden -Wait -PassThru
          if ($gui.ExitCode -ne 0) { throw 'Portable GUI assets or runtime failed.' }
          & (Join-Path $package.FullName 'firmware-flasher.exe') --chip esp32p4 image-info (Join-Path $package.FullName 'firmware/guition-p4/application.bin')
          if ($LASTEXITCODE -ne 0) { throw 'Portable flasher failed.' }
          & (Join-Path $package.FullName 'firmware-flasher.exe') --chip esp32s3 image-info (Join-Path $package.FullName 'firmware/waveshare-s3-43/application.bin')
          if ($LASTEXITCODE -ne 0) { throw 'Portable S3 flasher failed.' }
      - name: Collect release metadata
        shell: pwsh
        run: |
          $archive = Get-ChildItem work/windows-release -Filter '*.zip' | Select-Object -First 1
          $installer = Get-ChildItem work/windows-release -Filter 'AI-Monitor-Setup-*' | Select-Object -First 1
          $sum = (Get-FileHash -LiteralPath $archive.FullName -Algorithm SHA256).Hash.ToLower() + '  ' + $archive.Name
          $sum += [Environment]::NewLine + (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLower() + '  ' + $installer.Name
          $sums = Join-Path $archive.DirectoryName 'SHA256SUMS.txt'
          [IO.File]::WriteAllText($sums, $sum + [Environment]::NewLine)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-package
          path: |
            work/windows-release/*.zip
            work/windows-release/AI-Monitor-Setup-*
            work/windows-release/SHA256SUMS.txt
            docs/RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: windows
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-package
          path: work/publish
      - name: Create reviewed draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          $archive = Get-ChildItem work/publish/work/windows-release -Filter '*.zip' | Select-Object -First 1
          if (-not $archive) { throw 'Release archive missing.' }
          $sums = Join-Path $archive.DirectoryName 'SHA256SUMS.txt'
          $installer = Get-ChildItem $archive.DirectoryName -Filter 'AI-Monitor-Setup-*' | Select-Object -First 1
          if (-not $installer) { throw 'Installer asset missing.' }
          $sum = (Get-FileHash -LiteralPath $archive.FullName -Algorithm SHA256).Hash.ToLower() + '  ' + $archive.Name
          $sum += [Environment]::NewLine + (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLower() + '  ' + $installer.Name
          [IO.File]::WriteAllText($sums, $sum + [Environment]::NewLine)
          gh release create $env:GITHUB_REF_NAME $archive.FullName $installer.FullName $sums --verify-tag --draft --title "AI Monitor $env:GITHUB_REF_NAME" --notes-file work/publish/docs/RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed.' }
