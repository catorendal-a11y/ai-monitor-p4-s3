name: LimitBuddy terminal release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.release.outputs.build }}
    steps:
      - name: Preserve an existing reviewed release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'build=false' >> "$GITHUB_OUTPUT"
          else
            echo 'build=true' >> "$GITHUB_OUTPUT"
          fi

  firmware:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: esp32p4-release
            board: guition-p4
          - environment: esp32s3-waveshare-43-release
            board: waveshare-s3-43
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Require tag to match firmware version
        run: |
          python - <<'PY'
          import os, pathlib, sys
          sys.path.insert(0, 'tools')
          from project_version import HOST_VERSION, fw_version
          version = fw_version(pathlib.Path('.'))
          assert os.environ['GITHUB_REF_NAME'] == version, 'Tag must match FW_VERSION'
          assert HOST_VERSION == version, 'Host version must match FW_VERSION'
          # Releases up to v1.19.1-rc18 were named AI Monitor; later ones are LimitBuddy.
          heading = next(line.strip() for line in pathlib.Path('docs/RELEASE_NOTES.md').read_text(encoding='utf-8-sig').splitlines() if line.startswith(('# AI Monitor v', '# LimitBuddy v')))
          assert heading in ('# AI Monitor ' + version, '# LimitBuddy ' + version), 'Release notes must match the tag'
          PY
      - run: python -m pip install 'platformio>=6.1,<7' -r tools/requirements.txt
      - run: python -m platformio run -e ${{ matrix.environment }}
      - if: matrix.environment == 'esp32p4-release'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libegl1 libopengl0
      - if: matrix.environment == 'esp32p4-release'
        run: python scripts/run_tests.py --ui
      - name: Collect matching factory/application images
        run: python scripts/collect_firmware.py --environment ${{ matrix.environment }} --output work/prebuilt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: firmware-${{ matrix.board }}
          path: work/prebuilt/${{ matrix.board }}/*.bin
          if-no-files-found: error
          retention-days: 7

  windows:
    needs: firmware
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: firmware-guition-p4
          path: work/prebuilt/guition-p4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: firmware-waveshare-s3-43
          path: work/prebuilt/waveshare-s3-43
      - run: python -m pip install -r tools/requirements.txt -r scripts/requirements-test.txt
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python scripts/build_terminal_release.py --firmware-dir work/prebuilt --windows-runtime
      - name: Test exact Windows archive without a NOVA application EXE
        shell: pwsh
        run: |
          $archive = @(Get-ChildItem work/terminal-release -Filter '*.zip')
          if ($archive.Count -ne 1) { throw 'Expected exactly one terminal archive.' }
          $extracted = Join-Path $env:RUNNER_TEMP 'nova-release-smoke'
          Expand-Archive -LiteralPath $archive[0].FullName -DestinationPath $extracted
          $package = @(Get-ChildItem $extracted -Directory)
          if ($package.Count -ne 1) { throw 'Terminal archive must contain one package root.' }
          python scripts/test_terminal_package.py --package $package[0].FullName
          if ($LASTEXITCODE -ne 0) { throw 'Terminal installation test failed.' }
      - name: Collect terminal release metadata
        shell: pwsh
        run: |
          $archive = Get-ChildItem work/terminal-release -Filter '*.zip' | Select-Object -First 1
          $sum = (Get-FileHash -LiteralPath $archive.FullName -Algorithm SHA256).Hash.ToLower() + '  ' + $archive.Name
          [IO.File]::WriteAllText((Join-Path $archive.DirectoryName 'SHA256SUMS.txt'), $sum + [Environment]::NewLine)
          $allNotes = [IO.File]::ReadAllText('docs/RELEASE_NOTES.md')
          $current = [regex]::Match($allNotes, '\A[\s\S]*?(?=\r?\n# (?:AI Monitor|LimitBuddy) v|\z)').Value.Trim() + [Environment]::NewLine
          [IO.File]::WriteAllText((Join-Path $archive.DirectoryName 'RELEASE_NOTES-current.md'), $current)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-package
          path: |
            work/terminal-release/*.zip
            work/terminal-release/SHA256SUMS.txt
            work/terminal-release/RELEASE_NOTES-current.md
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: windows
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-package
          path: work/publish
      - name: Verify downloaded terminal archive before attesting
        shell: pwsh
        run: |
          $taskFolder = 'work/publish'
          $archive = Get-ChildItem $taskFolder -Filter '*.zip' | Select-Object -First 1
          if (-not $archive) { throw 'Terminal archive missing.' }
          $recorded = @(Get-Content -LiteralPath (Join-Path $taskFolder 'SHA256SUMS.txt'))
          $expected = (Get-FileHash -LiteralPath $archive.FullName -Algorithm SHA256).Hash.ToLower() + '  ' + $archive.Name
          if ($recorded.Count -ne 1 -or $recorded[0] -cne $expected) { throw 'Terminal archive checksum mismatch.' }
      - name: Attest verified terminal artifacts
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            work/publish/*.zip
            work/publish/SHA256SUMS.txt
      - name: Create reviewed draft terminal release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          gh release view $env:GITHUB_REF_NAME --json tagName,isDraft *> $null
          if ($LASTEXITCODE -eq 0) { exit 0 }
          $archive = Get-ChildItem work/publish -Filter '*.zip' | Select-Object -First 1
          $sums = Join-Path $archive.DirectoryName 'SHA256SUMS.txt'
          gh release create $env:GITHUB_REF_NAME $archive.FullName $sums --verify-tag --draft --title "LimitBuddy $env:GITHUB_REF_NAME" --notes-file work/publish/RELEASE_NOTES-current.md
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed.' }
